<html>
<head>
<style>
button{
position: absolute;
top: 40%;
left: 40%;
padding: 16px 30px;
text-align: center;
}
h2{
text-align: center;
position: absolute;
top: 55%;
left: 33%;
}
</style>
<title>Background color</title>
</head>
<body>
<h2> To change background color</h2><button onclick="background()">click me </button>
<script>
function background()
 {
 var r=Math.floor(Math.random()*256);
 var g=Math.floor(Math.random()*256);
 var b=Math.floor(Math.random()*256);
 document.body.style.backgroundColor="rgb("+r+","+g+","+b+")";
 }
</script>
</body>
</html>
